[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricehunter"
version = "0.1.0"
description = "Competitor price intelligence: discover, match, track and reprice against competitor listings."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "extruct>=0.17",
  "pydantic>=2.6",
  "rapidfuzz>=3.6",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
js = ["playwright>=1.44"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
pricehunter = "pricehunter.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pricehunter = ["templates/*.html", "demo_sites/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
